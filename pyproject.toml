[project]
name = "document-search-platform"
version = "0.1.0"
description = "Agentic RAG platform over a curated PDF corpus"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.20",
    # Configuration
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Storage
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "alembic>=1.14",
    # Background tasks
    "celery>=5.4",
    "redis>=5.2",
    # HTTP
    "httpx>=0.28",
]

[project.optional-dependencies]
# Kept in groups so a failure to resolve one heavy stack does not block the others.
# Installed together by `make install`.
ingest = [
    "docling>=2.14",
]
retrieval = [
    "llama-index-core>=0.12",
    "llama-index-vector-stores-postgres>=0.4",
    "sentence-transformers>=3.3",
]
agents = [
    "crewai>=0.86",
]
observability = [
    # The Phoenix SERVER runs as a container; only the client library is needed here.
    # Depending on the full `arize-phoenix` package would pull the server and its web
    # stack into every backend and worker image for no benefit.
    "arize-phoenix-client>=1.0",
    "arize-phoenix-otel>=0.6",
    "openinference-instrumentation-litellm>=0.1",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp>=1.29",
]
evaluation = [
    "ragas>=0.2",
    # ⚠️ Pinned because ragas 0.4.x still imports
    # `langchain_community.chat_models.vertexai`, which langchain-community
    # removed in 0.4 while sunsetting the package. Importing `ragas.metrics` at
    # all raises ModuleNotFoundError otherwise — the metrics never load, so the
    # failure is total rather than partial.
    "langchain-community<0.4",
    # RAGAs judges with an LLM. This binds it to the LOCAL Ollama host — without
    # it RAGAs defaults to OpenAI and the evaluation would silently depend on an
    # external API key, which is the opposite of a self-contained submission.
    "langchain-ollama>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pypdf>=6.14.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# FastAPI declares Form/File/Header parameters as argument defaults. That is the
# framework's documented idiom, not the mutable-default bug B008 detects.
"app/api/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

# Third-party packages without stubs. Kept explicit rather than a blanket ignore,
# so an untyped import is a decision rather than an accident.
[[tool.mypy.overrides]]
module = [
    "celery.*",
    "docling.*",
    "docling_core.*",
    "crewai.*",
    "ragas.*",
    "datasets.*",
    "langchain_ollama.*",
    "pgvector.*",
    "sentence_transformers.*",
    # Optional-extra packages. These are imported inside try/except so the system
    # runs without them — degrading to bundled prompts and no tracing — which means
    # type checking must not require them to be installed either.
    "phoenix.*",
    "opentelemetry.*",
    "openinference.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires a running Postgres (deselect with '-m \"not integration\"')",
    "models: requires a running Ollama with models pulled",
    # NOT named "phoenix" — arize-phoenix-client's own pytest plugin reserves that
    # exact marker name for "record this test as a Phoenix experiment run" (see
    # phoenix.client.pytest.plugin). Reusing it silently wraps our tests in the
    # plugin's own experiment-tracking behavior, which redirects spans into
    # ad-hoc "Experiment-..." projects — discovered only because tests that
    # passed in isolation started failing intermittently as part of the full
    # suite, depending on accumulated suite-level state.
    "live_phoenix: requires a running Phoenix with observability extras installed",
]
